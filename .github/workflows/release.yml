name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build editor
        working-directory: desktop
        run: wails build -clean -tags webkit2_41

      - name: Build patcher
        working-directory: desktop
        run: go build -tags webkit2_41 -o build/bin/bl2patch ./cmd/bl2patch

      - name: Package
        run: |
          cd desktop/build/bin
          chmod +x bl2-save-editor bl2patch
          zip bl2-save-editor-linux-amd64.zip bl2-save-editor bl2patch

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bl2-save-editor-linux-amd64
          path: desktop/build/bin/bl2-save-editor-linux-amd64.zip

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Build editor
        working-directory: desktop
        run: wails build -clean

      - name: Build patcher
        working-directory: desktop
        run: go build -o build/bin/bl2patch.exe ./cmd/bl2patch

      - name: Package
        shell: pwsh
        run: |
          cd desktop/build/bin
          Compress-Archive -Path bl2-save-editor.exe, bl2patch.exe -DestinationPath bl2-save-editor-windows-amd64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: bl2-save-editor-windows-amd64
          path: desktop/build/bin/bl2-save-editor-windows-amd64.zip

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip
          generate_release_notes: true
